import_historical_data:
  name: Import historical data
  description: Import up to seven days of readings. Requests count toward the meter's request limit.
  fields:
    config_entry_id:
      name: Linky meter
      description: Select the Linky meter whose historical data to import.
      required: true
      selector:
        config_entry:
          integration: linky
    start_date:
      name: Start date
      description: First day to import (inclusive).
      required: true
      example: "2024-01-01"
      selector:
        date:
    end_date:
      name: End date
      description: Stop before this day (exclusive). Defaults to today in Europe/Paris.
      required: false
      example: "2024-12-31"
      selector:
        date:
refresh:
  name: Refresh now
  description: Run the daily Linky refresh now if it has not been attempted today and the request budget allows it.
  fields:
    config_entry_id:
      name: Linky meter
      description: Select the Linky meter to refresh.
      required: true
      selector:
        config_entry:
          integration: linky
get_status:
  name: Get collection status
  description: Show the request budget and whether the selected meter can refresh. Does not contact Conso.
  fields:
    config_entry_id:
      name: Linky meter
      description: Select the Linky meter to inspect.
      required: true
      selector:
        config_entry:
          integration: linky
import_conso_csv:
  name: Import a Conso Downloader CSV
  description: Fill missing hourly consumption points from a CSV without contacting Conso. Existing values are kept.
  fields:
    config_entry_id:
      name: Linky meter
      description: Select the meter whose PRM is in the filename.
      required: true
      selector:
        config_entry:
          integration: linky
    file:
      name: CSV file
      description: Select the consumption CSV exported by Conso Downloader.
      required: true
      selector:
        file:
          accept: ".csv,text/csv"
