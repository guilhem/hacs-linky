import_historical_data:
  name: Import historical data
  description: Import up to seven days of readings. Requests count toward the meter's request limit.
  fields:
    config_entry_id:
      name: Linky meter
      description: Select the Linky meter whose historical data to import.
      required: true
      selector:
        config_entry:
          integration: linky
    start_date:
      name: Start date
      description: First day to import (inclusive).
      required: true
      example: "2024-01-01"
      selector:
        date:
    end_date:
      name: End date
      description: Stop before this day (exclusive). Defaults to today in Europe/Paris.
      required: false
      example: "2024-12-31"
      selector:
        date:
